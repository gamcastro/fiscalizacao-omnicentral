<style>
  :root {
    --cor-fundo: #f4f6f8;
    --cor-cartao: #ffffff;
    --cor-texto: #1f2933;
    --cor-suave: #616e7c;
    --cor-borda: #d9e2ec;
    --cor-primaria: #1d4e89;
    --cor-primaria-escura: #163d6b;
    --cor-lateral: #102a43;
    --cor-ok: #1e7b4a;
    --cor-ok-fundo: #e3f4ea;
    --cor-erro: #b42318;
    --cor-erro-fundo: #fdecea;
    --cor-alerta: #9a6700;
    --cor-alerta-fundo: #fff4d6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 14px;
    color: var(--cor-texto);
    background: var(--cor-fundo);
  }

  h1 { font-size: 22px; margin: 0 0 16px; }
  h2 { font-size: 16px; margin: 0 0 12px; }

  /* Faixa do ambiente de homologação */
  .faixa-ambiente {
    background: repeating-linear-gradient(45deg, #c2410c, #c2410c 14px, #ea580c 14px, #ea580c 28px);
    color: #fff;
    font-weight: 700;
    text-align: center;
    letter-spacing: .04em;
    padding: 6px 12px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .faixa-ambiente.fixa { position: fixed; left: 0; right: 0; }

  /* Estrutura */
  .app { display: flex; min-height: 100vh; }

  .lateral {
    width: 240px;
    flex-shrink: 0;
    background: var(--cor-lateral);
    color: #fff;
    display: flex;
    flex-direction: column;
  }

  .marca { padding: 20px 18px; border-bottom: 1px solid rgba(255, 255, 255, .12); }
  .marca strong { display: block; font-size: 16px; }
  .marca span { font-size: 12px; opacity: .75; }

  .menu { flex: 1; padding: 10px 0; }
  .menu a {
    display: block;
    padding: 10px 18px;
    color: #d9e2ec;
    text-decoration: none;
    border-left: 3px solid transparent;
  }
  .menu a:hover { background: rgba(255, 255, 255, .06); color: #fff; }
  .menu a.ativo { background: rgba(255, 255, 255, .1); color: #fff; border-left-color: #6fa8dc; }

  .usuario-logado {
    padding: 14px 18px;
    border-top: 1px solid rgba(255, 255, 255, .12);
    font-size: 12px;
    line-height: 1.5;
  }
  .usuario-logado strong { display: block; font-size: 13px; }
  .usuario-logado span { display: block; opacity: .8; }
  .usuario-logado .email { opacity: .6; word-break: break-all; }
  .usuario-logado .versao { opacity: .45; margin-top: 6px; }

  .conteudo { flex: 1; padding: 24px 32px; min-width: 0; }

  .cabecalho-tela { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .cabecalho-tela h1 { margin: 0; }

  /* Componentes */
  .cartao {
    background: var(--cor-cartao);
    border: 1px solid var(--cor-borda);
    border-radius: 6px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }

  .vazio { color: var(--cor-suave); text-align: center; padding: 12px; }

  .mensagem { padding: 10px 14px; border-radius: 4px; margin-bottom: 16px; border: 1px solid; white-space: pre-line; }
  .mensagem.sucesso { background: var(--cor-ok-fundo); color: var(--cor-ok); border-color: #b7e1c7; }
  .mensagem.erro { background: var(--cor-erro-fundo); color: var(--cor-erro); border-color: #f5c2bd; }
  .mensagem.info { background: #e8f0fb; color: var(--cor-primaria); border-color: #c4d7f2; }

  .botao {
    font: inherit;
    padding: 7px 14px;
    border: 1px solid var(--cor-borda);
    border-radius: 4px;
    background: #fff;
    color: var(--cor-texto);
    cursor: pointer;
  }
  .botao:hover { background: #f0f4f8; }
  .botao.primario { background: var(--cor-primaria); border-color: var(--cor-primaria); color: #fff; }
  .botao.primario:hover { background: var(--cor-primaria-escura); }
  .botao.pequeno { padding: 4px 10px; font-size: 13px; }
  .botao:disabled { opacity: .55; cursor: default; }

  .grade-form {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px 18px;
    margin-bottom: 16px;
  }
  .grade-form label { display: flex; flex-direction: column; gap: 4px; font-weight: 600; font-size: 13px; }
  .grade-form label.check { flex-direction: row; align-items: center; gap: 8px; padding-top: 20px; }
  .grade-form input[type="text"],
  .grade-form input[type="email"],
  .grade-form input[type="month"],
  .grade-form select {
    font: inherit;
    font-weight: normal;
    padding: 7px 9px;
    border: 1px solid var(--cor-borda);
    border-radius: 4px;
    background: #fff;
  }
  .grade-form input[readonly] { background: #f0f4f8; color: var(--cor-suave); }

  .acoes { display: flex; gap: 8px; }

  .tabela { width: 100%; border-collapse: collapse; }
  .tabela th, .tabela td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--cor-borda); }
  .tabela th { font-size: 12px; text-transform: uppercase; color: var(--cor-suave); letter-spacing: .03em; }
  .tabela tr.inativo td { color: var(--cor-suave); }
  .acoes-linha { white-space: nowrap; text-align: right; }

  .etiqueta { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  .etiqueta.ok { background: var(--cor-ok-fundo); color: var(--cor-ok); }
  .etiqueta.off { background: #eceff1; color: var(--cor-suave); }
  .etiqueta.nok { background: var(--cor-erro-fundo); color: var(--cor-erro); }
  .etiqueta.st-RASCUNHO { background: #eceff1; color: var(--cor-suave); }
  .etiqueta.st-EM_CONFERENCIA { background: #e8f0fb; color: var(--cor-primaria); }
  .etiqueta.st-INSTRUINDO_SEI { background: var(--cor-alerta-fundo); color: var(--cor-alerta); }
  .etiqueta.st-ENVIADA_COGECON { background: var(--cor-ok-fundo); color: var(--cor-ok); }

  /* Lançamento */
  .dica { font-size: 12px; color: var(--cor-suave); font-weight: normal; }
  .dica.bloco { display: block; }
  .cabecalho-form { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .cabecalho-form h2 { margin: 0; }
  .grade-form label.largo { grid-column: span 2; }
  .grade-form input:disabled { background: #f0f4f8; color: var(--cor-suave); }
  .tabela-itens td { vertical-align: top; }
  .tabela-itens .num-item { font-weight: 600; width: 40px; }
  .tabela-itens input {
    font: inherit;
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--cor-borda);
    border-radius: 4px;
  }
  .tabela-itens input.lan-rel, .tabela-itens input.lan-qtd { max-width: 130px; text-align: right; }
  .tabela-itens input:disabled { background: #f0f4f8; color: var(--cor-suave); }
  input.obrigatorio { border-color: var(--cor-alerta); background: var(--cor-alerta-fundo); }
  .bloco-eventuais { margin-top: 14px; }
  .bloco-eventuais summary { cursor: pointer; font-weight: 600; color: var(--cor-primaria); padding: 6px 0; }
  .avisos {
    background: var(--cor-alerta-fundo);
    color: var(--cor-alerta);
    border: 1px solid #f0d58a;
    border-radius: 4px;
    padding: 10px 14px;
    margin-bottom: 16px;
  }
  .avisos ul { margin: 6px 0 0; padding-left: 20px; }
  .aviso-bloqueio {
    background: #eceff1;
    border-radius: 4px;
    padding: 8px 12px;
    color: var(--cor-suave);
  }

  /* Painel */
  .subtitulo { font-size: 14px; margin: 20px 0 8px; color: var(--cor-suave); }
  .lista-alertas { list-style: none; margin: 0; padding: 0; }
  .lista-alertas li { padding: 9px 12px; border-radius: 4px; margin-bottom: 6px; border-left: 4px solid; }
  .lista-alertas li.alerta-alerta { background: var(--cor-alerta-fundo); border-color: #e0a800; color: var(--cor-alerta); }
  .lista-alertas li.alerta-critico { background: var(--cor-erro-fundo); border-color: var(--cor-erro); color: var(--cor-erro); }
  .lista-alertas li.sem-alertas { background: var(--cor-ok-fundo); border-color: var(--cor-ok); color: var(--cor-ok); }
  .lista-alertas li.vazio { border: 0; }
  .lista-alertas a { font-weight: 600; color: inherit; margin-left: 6px; }

  .grade-saldos { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .card-saldo { border: 1px solid var(--cor-borda); border-radius: 6px; padding: 14px; background: #fff; }
  .card-saldo.alerta { border-color: #e0a800; background: var(--cor-alerta-fundo); }
  .card-saldo.critico { border-color: var(--cor-erro); background: var(--cor-erro-fundo); }
  .card-titulo { font-size: 13px; min-height: 54px; }
  .card-pct { font-size: 22px; font-weight: 600; margin: 8px 0 6px; }
  .card-numeros { margin: 10px 0 6px; font-size: 13px; }
  .card-numeros div { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px dashed var(--cor-borda); }
  .card-numeros div:last-child { border-bottom: 0; }
  .card-numeros dt { color: var(--cor-suave); }
  .card-numeros dd { margin: 0; font-weight: 600; }

  .barra { height: 8px; background: #e4e7eb; border-radius: 4px; overflow: hidden; }
  .barra-preenchida { height: 100%; background: var(--cor-primaria); }
  .barra-preenchida.alerta { background: #e0a800; }
  .barra-preenchida.critico { background: var(--cor-erro); }

  .tabela-eventuais .numero { text-align: right; white-space: nowrap; }
  .tabela-eventuais .coluna-barra { width: 30%; }
  .tabela-eventuais tr.alerta td { background: var(--cor-alerta-fundo); }
  .tabela-eventuais tr.critico td { background: var(--cor-erro-fundo); }

  /* Detalhe da competência */
  h3 { font-size: 14px; margin: 0; }
  .numero { text-align: right; white-space: nowrap; }
  .grade-detalhe { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; }
  .grade-detalhe > .cartao { margin-bottom: 16px; }
  .linha-info { margin: 10px 0 0; }
  .linha-tempo { list-style: none; margin: 0 0 12px; padding: 0 0 0 14px; border-left: 2px solid var(--cor-borda); }
  .linha-tempo li { position: relative; padding: 0 0 12px 8px; }
  .linha-tempo li::before {
    content: ''; position: absolute; left: -20px; top: 4px;
    width: 10px; height: 10px; border-radius: 50%; background: var(--cor-primaria);
  }
  .linha-tempo li .dica { display: block; }
  .bloco-reabrir { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--cor-borda); }
  .bloco-reabrir label { display: flex; flex-direction: column; gap: 4px; font-weight: 600; font-size: 13px; margin-bottom: 8px; }
  .bloco-reabrir textarea { font: inherit; font-weight: normal; padding: 7px 9px; border: 1px solid var(--cor-borda); border-radius: 4px; }
  .grade-form input[type="date"] {
    font: inherit; font-weight: normal; padding: 7px 9px; border: 1px solid var(--cor-borda); border-radius: 4px;
  }
  .grade-textos { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grade-textos .cabecalho-form { justify-content: space-between; margin-bottom: 8px; }
  .documento-sei {
    border: 1px solid var(--cor-borda); border-radius: 4px; background: #fff;
    padding: 14px 18px; font-family: Calibri, Arial, sans-serif; font-size: 13px; line-height: 1.45;
  }
  .documento-sei p { margin: 0 0 8px; }

  @media (max-width: 1100px) {
    .grade-detalhe, .grade-textos { grid-template-columns: 1fr; }
  }

  /* Página de acesso negado */
  .pagina-aviso { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
  .aviso { max-width: 520px; width: 100%; }
  .email-destaque {
    font-family: Consolas, monospace;
    font-size: 15px;
    background: var(--cor-fundo);
    padding: 8px 12px;
    border-radius: 4px;
    word-break: break-all;
  }
  .rodape-aviso { font-size: 12px; color: var(--cor-suave); margin-top: 24px; }

  /* Telas estreitas: apenas legível */
  @media (max-width: 800px) {
    .app { flex-direction: column; }
    .lateral { width: 100%; }
    .conteudo { padding: 16px; }
    .cartao { overflow-x: auto; }
  }
</style>
